<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nathan Sorin</title>
<meta name="description" content="Nathan Sorin – postdoctoral researcher at TUM. AI for business sustainability, creativity and sovereignty.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE  occasion: a young scholar's personal site, confident and warm
   IDEA   a journal plate: ideas branching out of a structured grid (AI meets creativity and nature)
   PICTURE Nathan's portrait in soft rings on the deep blue hero
   COLOUR white ground, ink #14110f, ultramarine #1d2bd8 field, coral #ff6a4d for the chosen ideas
   TYPE   Spectral 500 display + Inter text
   LAYOUT full-bleed blue hero, greeting left, portrait right; phone: portrait on top */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0d0e18);--ink:light-dark(#14110f,#ecebf3);--soft:light-dark(#5b5d6b,#a3a5b8);--line:light-dark(#e3e4ea,#262838);--blue:#0b1966;--blue2:light-dark(#1a2b9e,#8d96ff);--tint:light-dark(#f1f2f8,#151733);--coral:#ff6a4d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.6 Inter,system-ui,sans-serif;overflow-x:clip}
a{color:var(--blue2);text-underline-offset:3px}
img{max-width:100%}
h1,h2,h3{font-family:Spectral,Georgia,serif;font-weight:500;letter-spacing:-.02em;line-height:1.05;text-wrap:balance;margin:0}
h2{font-size:clamp(32px,4vw,46px);margin-bottom:28px}
h3{font-size:22px;line-height:1.2}
.wrap{max-width:1240px;margin:0 auto}
.band{padding-block:clamp(48px,6vw,96px);padding-inline:max(5vw,16px)}
.intro{color:var(--soft);max-width:60ch;margin:-12px 0 32px}
nav{position:sticky;top:0;z-index:10;background:var(--blue);color:#fff;padding:0 max(5vw,16px)}
nav .wrap{display:flex;align-items:center;gap:8px 24px;flex-wrap:wrap;min-height:60px}
nav .me{font-family:Spectral,serif;font-size:20px;color:#fff;text-decoration:none;margin-right:auto}
nav .links{display:flex;gap:4px 20px;flex-wrap:wrap}
nav .links a{color:#fff;opacity:.85;text-decoration:none;font-size:15px;padding:8px 0}
nav .links a:hover,nav .links a:focus-visible{opacity:1;text-decoration:underline}
.hero{background:var(--blue);color:#fff;position:relative;overflow:hidden;padding:0 max(5vw,16px)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);min-height:min(80svh,700px);align-items:center}
.hero .txt{padding-block:56px 64px;position:relative;z-index:2}
.hero h1{font-size:clamp(52px,7vw,96px);color:#fff}
.hero .role{font-size:clamp(18px,1.7vw,21px);margin:24px 0 0;color:#fff;font-weight:500}
.hero .sub{font-size:clamp(16px,1.5vw,18px);margin:14px 0 0;max-width:32em;color:#dfe2ff}
.hero .sub b{color:#fff;font-weight:600}
.flags{display:inline-flex;gap:6px;vertical-align:-5px;margin-left:6px}
.fl{display:inline-block;width:22px;height:22px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1.5px rgba(255,255,255,.9),0 2px 6px rgba(0,0,0,.35)}
.fl svg{display:block;width:100%;height:100%}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;font-weight:500;font-size:15px;text-decoration:none;border:1.5px solid #fff;color:#fff}
.btn.solid{background:#fff;color:var(--blue)}
.btn:hover{background:var(--coral);border-color:var(--coral);color:#fff}
.btn:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.fig{display:grid;place-items:center;padding-block:48px;position:relative}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.fig line{stroke:#fff;stroke-width:1}
.me-photo{position:relative;z-index:1;display:block}
.me-wrap{position:relative;z-index:1}
.aitag{position:absolute;z-index:2;left:50%;bottom:-16px;transform:translateX(-50%);background:#fff;color:#0b1966;font-weight:600;font-size:15px;padding:7px 18px 7px 14px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.35);display:inline-flex;align-items:center;gap:8px}
.aitag::before{content:"";width:9px;height:9px;border-radius:50%;background:#ff6a4d;box-shadow:0 0 0 4px rgba(255,106,77,.25)}
.aitag:empty{display:none}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.fig .hot{animation:pulse 3.2s ease-in-out infinite}
.fig .sig{stroke:#ff9a85;stroke-width:1.6;stroke-linecap:round;animation:flow 4s linear infinite}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:calc(-1px * var(--l))}}
@media(prefers-reduced-motion:reduce){.fig .sig{display:none}.fig .hot{animation:none}}
.me-photo{width:clamp(200px,24vw,300px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:6px solid #fff;box-shadow:0 0 0 22px rgba(255,255,255,.07),0 0 0 46px rgba(255,255,255,.04);background:#fff}
.about .wrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:clamp(28px,5vw,80px);align-items:start}
.lead{font-family:Spectral,serif;font-size:clamp(22px,2.3vw,28px);line-height:1.35;margin:0 0 22px}
.about p{max-width:66ch}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:20px;margin-top:36px;padding-top:28px;border-top:1px solid var(--line)}
.facts b{display:block;font-family:Spectral,serif;font-weight:500;font-size:32px;line-height:1.1;color:var(--blue2)}
.facts span{font-size:14px;color:var(--soft)}
.thesis{background:var(--blue);color:#fff;border-radius:8px;padding:28px;position:sticky;top:90px}
.thesis .k{font-size:14px;color:#c9ceff}
.thesis h3{color:#fff;font-size:26px;margin:10px 0 6px}
.thesis .en{color:#dfe2ff;font-style:italic;font-family:Spectral,serif;font-size:18px;margin:0 0 18px}
.thesis p{margin:0 0 18px;font-size:15px;color:#e6e8ff}
.themes{background:var(--tint)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.card{background:var(--bg);border-radius:6px;padding:28px;display:flex;flex-direction:column;gap:14px}
.card svg{width:56px;height:56px}
.card p{margin:0;color:var(--soft)}
.pubs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.pubs li{display:grid;grid-template-columns:5.5em minmax(0,1fr) auto;gap:8px 24px;padding:24px 0;border-bottom:1px solid var(--line);align-items:baseline}
.pubs .yr{font-family:Spectral,serif;font-size:28px;color:var(--blue2);line-height:1}
.pubs .t{font-weight:600;font-size:17px;line-height:1.4}
.pubs .a{color:var(--soft);font-size:15px;margin-top:4px}
.pubs .a b{color:var(--ink);font-weight:500}
.pubs .v{font-style:italic}
.tag{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--tint);color:var(--blue2);white-space:nowrap}
.pubs .acts{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:10px;align-items:center}
.pubs .acts a{font-size:14px;font-weight:500}
details.sum summary{cursor:pointer;font-size:14px;font-weight:500;color:var(--blue2);list-style:none;min-height:28px;display:inline-flex;align-items:center;gap:6px}
details.sum summary::-webkit-details-marker{display:none}
details.sum summary::before{content:"+";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--tint);font-size:15px}
details.sum[open] summary::before{content:"−"}
details.sum[open]{flex-basis:100%}
.sumbox{margin-top:12px;background:var(--tint);border-radius:6px;padding:18px 20px;font-size:15.5px;max-width:72ch}
.sumbox p{margin:0 0 10px}.sumbox p:last-child{margin:0}
.sumbox b{color:var(--ink)}
.courses{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.courses li{padding:28px 24px;justify-content:center;min-height:120px;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;gap:6px}
.courses .c{font-family:Spectral,serif;font-size:24px;line-height:1.15}
.courses .d{color:var(--soft);font-size:15px}
.jr{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.jr li{display:grid;grid-template-columns:72px 9em minmax(0,1fr);gap:4px 24px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.logo{width:72px;height:72px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;padding:8px}
.logo{display:flex;align-items:center;justify-content:center}
.logo img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.logo.two{gap:6px;align-items:center;justify-content:center}.logo.two img{flex:1 1 0;min-width:0;height:100%;width:100%}
.logo span{font-weight:600;font-size:15px;color:var(--blue2);text-align:center;line-height:1.1}
.jr .when{color:var(--soft);font-size:15px;white-space:nowrap}
.jr .what{font-weight:600;font-size:17px}
.jr .where{color:var(--soft);font-size:15px}
.cards .card h3{font-size:30px}
.score{font-family:Spectral,serif;font-size:24px;color:var(--blue2);white-space:nowrap}
.score small{font-family:Inter,sans-serif;font-size:13px;color:var(--soft);margin-left:4px}
.side h3{margin:0 0 12px}
.side ul{margin:0 0 30px;padding-left:20px}
.side li{margin-bottom:6px}
.outreach{background:var(--tint)}
.out{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px}
.feature{align-self:start;background:var(--blue);color:#fff;border-radius:8px;padding:32px;display:flex;flex-direction:column;gap:16px}
.feature h3{color:#fff;font-size:28px}
.feature p{margin:0;color:#e6e8ff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:4px 12px;font-size:14px}
.media{display:grid;gap:16px}
.mcard{background:var(--bg);border-radius:8px;padding:24px 26px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:start}
.mcard .ic{grid-row:span 3;width:44px;height:44px;border-radius:50%;background:var(--tint);display:grid;place-items:center;color:var(--blue2)}
.mcard .ic svg{width:22px;height:22px}
.mlogo{display:flex;align-items:center;height:56px;margin-bottom:8px}
.mlogo img{max-height:56px;max-width:170px;width:auto;height:auto}
.mcard .ic{margin-bottom:8px}
.mcard .src{font-size:14px;color:var(--soft)}
.mcard .ti{font-weight:600;font-size:17px}
.mcard p{margin:4px 0 0;color:var(--soft);font-size:15px}
.mcard a{font-size:14px;font-weight:500}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,6vw,96px)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl li{position:relative;padding:0 0 26px 32px}
.tl li::before{content:"";position:absolute;left:0;top:7px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2.5px solid var(--blue2)}
.tl li:first-child::before{background:var(--coral);border-color:var(--coral)}
.tl .when{font-size:14px;color:var(--soft);white-space:nowrap}
.tl .what{font-weight:600}
.tl .where{color:var(--soft);font-size:15px}
.news{list-style:none;margin:0;padding:0}
.news li{padding:0 0 22px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.news .when{font-size:14px;color:var(--coral);font-weight:600}
.news p{margin:4px 0 0}
footer{background:var(--blue);color:#fff}
footer h2{color:#fff;margin-bottom:16px}
footer .wrap{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:40px;align-items:end}
footer p{color:#dfe2ff;max-width:34em;margin:0 0 24px}
footer .mail{font-family:Spectral,serif;font-size:clamp(22px,3vw,32px);color:#fff;overflow-wrap:anywhere}
footer .addr{display:block;margin-top:14px;color:#c9ceff;font-size:15px}
footer .soc{display:flex;flex-wrap:wrap;gap:10px}
footer small{display:block;margin-top:56px;color:#b9beff;font-size:13px}
@media(max-width:960px){.cards{grid-template-columns:minmax(0,1fr)}.split,.teach .wrap,.out{grid-template-columns:minmax(0,1fr)}}
@media(max-width:720px){
.hero .wrap{grid-template-columns:minmax(0,1fr);min-height:0}
.fig{order:-1;padding-block:48px 30px;justify-items:start}
.me-photo{width:170px;border-width:5px}
.me-wrap{margin-left:24px}
.aitag{font-size:13px;padding:6px 14px 6px 11px;bottom:-14px}
.hero .txt{padding-block:12px 48px}
.about .wrap{grid-template-columns:minmax(0,1fr)}
.thesis{position:static}
footer .wrap{grid-template-columns:minmax(0,1fr)}
.pubs li{grid-template-columns:minmax(0,1fr) auto}
.pubs .yr{font-size:22px;grid-row:1;grid-column:1}
.pubs .tag{grid-row:1;grid-column:2;justify-self:end}
.pubs li>div{grid-column:1/-1}
.courses{grid-template-columns:minmax(0,1fr)}
.jr li{grid-template-columns:56px minmax(0,1fr);gap:2px 16px}
.logo{width:56px;height:56px;grid-row:span 2;padding:4px;align-self:start}.logo span{font-size:11px}
.jr .when{grid-column:2}
nav .links{gap:2px 14px}nav .links a{font-size:14px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.fig .hot{animation:none}}
.pgroup{margin:44px 0 0}
.pgroup:first-of-type{margin-top:0}

.logo{position:relative}
.logo::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.8) 50%,transparent 65%);transform:translateX(-130%);pointer-events:none}
.anim .jr li .logo{opacity:0;translate:0 26px;scale:.9}

.anim .jr li .city{opacity:0;translate:18px 0}

.anim .jr li.in .logo img{animation:logoImg .6s ease-out calc(var(--d,0s) + .22s) forwards}

.anim .jr li.in .city{animation:cityIn .9s ease-out calc(var(--d,0s) + .3s) forwards}

if ("IntersectionObserver" in window && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
  document.documentElement.classList.add("anim");
  const logoObs = new IntersectionObserver(es => {
    es.filter(e => e.isIntersecting).forEach((e, i) => { e.target.style.setProperty("--d", (i * .12) + "s"); e.target.classList.add("in"); logoObs.unobserve(e.target); });
  }, { threshold: .3 });
  document.querySelectorAll(".jr li").forEach(li => logoObs.observe(li));
}

/* Podcast players under publications */
{
  const fmt = t => { t = Math.max(0, Math.floor(t || 0)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), sec = String(t % 60).padStart(2, "0"); return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`; };
  const rates = [1, 1.25, 1.5, 2];
  document.querySelectorAll(".pod").forEach(pod => {
    const au = pod.querySelector("audio"), bar = pod.querySelector(".pod-bar"), time = pod.querySelector(".pod-time"), btn = pod.querySelector(".pod-play"), rate = pod.querySelector(".pod-rate");
    const total = time.textContent.split("/")[1].trim();
    const show = () => { const d = au.duration || 0, c = au.currentTime || 0, pct = d ? c / d * 100 : 0; bar.value = Math.round(pct * 10); bar.style.setProperty("--p", pct + "%"); time.textContent = `${fmt(c)} / ${d ? fmt(d) : total}`; };
    btn.addEventListener("click", () => {
      if (au.paused) { document.querySelectorAll(".pod audio").forEach(a => { if (a !== au) a.pause(); }); au.play().catch(() => {}); } else au.pause();
    });
    au.addEventListener("play", () => { pod.classList.add("on"); btn.setAttribute("aria-label", "Pause the podcast"); });
    au.addEventListener("pause", () => { pod.classList.remove("on"); btn.setAttribute("aria-label", "Play the podcast"); });
    au.addEventListener("timeupdate", show); au.addEventListener("loadedmetadata", show);
    au.addEventListener("ended", () => { au.currentTime = 0; show(); });
    bar.addEventListener("input", () => { if (au.duration) { au.currentTime = bar.value / 1000 * au.duration; show(); } else { au.preload = "metadata"; au.load(); au.addEventListener("loadedmetadata", () => { au.currentTime = bar.value / 1000 * au.duration; show(); }, { once: true }); } });
    rate.addEventListener("click", () => { const r = rates[(rates.indexOf(au.playbackRate) + 1) % rates.length]; au.playbackRate = r; rate.textContent = String(r).replace(".", ",").replace(",", ".") + "×"; });
  });
}

/* Behind the photo: a light AI network. */
const net = $("net");
const drawNet = () => {
  const W = net.clientWidth, H = net.clientHeight;
  if (!W || !H || !ph.isConnected) { net.innerHTML = ""; return; }
  const fb = net.getBoundingClientRect(), pb = ph.getBoundingClientRect();
  const cx = pb.left - fb.left + pb.width / 2, cy = pb.top - fb.top + pb.height / 2, R = pb.width / 2;
  let seed = 5; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const rings = [[1.35, 9], [1.75, 12], [2.2, 15], [2.7, 16]], nodes = [];
  rings.forEach(([k, n], ri) => { for (let i = 0; i < n; i++) {
    const a = (i + rnd() * .6) / n * Math.PI * 2 + ri * .4, r = R * k * (.92 + rnd() * .16);
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    if (x > 6 && x < W - 6 && y > 6 && y < H - 6) nodes.push({ x, y, ri });
  }});
  const f = v => v.toFixed(1);
  let out = `<defs><radialGradient id="glow"><stop offset=".45" stop-color="#5566ff" stop-opacity=".35"/><stop offset="1" stop-color="#5566ff" stop-opacity="0"/></radialGradient></defs>
    <circle cx="${f(cx)}" cy="${f(cy)}" r="${f(R * 2.1)}" fill="url(#glow)" stroke="none"/>`;
  for (let i = 0; i < 46; i++) { const x = rnd() * W, y = rnd() * H, d = Math.hypot(x - cx, y - cy); if (d > R * 1.15) out += `<circle cx="${f(x)}" cy="${f(y)}" r="${(rnd() * .9 + .4).toFixed(1)}" fill="#fff" opacity="${(rnd() * .3 + .1).toFixed(2)}"/>`; }
  [1.55, 2.0, 2.45].forEach((k, i) => out += `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(R * k)}" fill="none" stroke="#fff" stroke-opacity="${(.14 - i * .03).toFixed(2)}" stroke-dasharray="${i === 1 ? "1 7" : "2 10"}" stroke-linecap="round"/>`);
  const links = [];
  nodes.forEach(n => {
    const near = nodes.filter(m => m !== n && m.ri >= n.ri).map(m => [m, Math.hypot(m.x - n.x, m.y - n.y)]).sort((a, b) => a[1] - b[1]).slice(0, 2);
    near.forEach(([m]) => { links.push([n, m]); out += `<line x1="${f(n.x)}" y1="${f(n.y)}" x2="${f(m.x)}" y2="${f(m.y)}" opacity="${(.24 - n.ri * .045).toFixed(2)}"/>`; });
    if (n.ri === 0) { const a = Math.atan2(n.y - cy, n.x - cx); const sx = cx + Math.cos(a) * R, sy = cy + Math.sin(a) * R; links.push([{x: sx, y: sy}, n]); out += `<line x1="${f(sx)}" y1="${f(sy)}" x2="${f(n.x)}" y2="${f(n.y)}" opacity=".22"/>`; }
  });
  links.filter((_, i) => i % 9 === 4).forEach(([a, b], i) => {
    const L = Math.hypot(b.x - a.x, b.y - a.y);
    out += `<line class="sig" x1="${f(a.x)}" y1="${f(a.y)}" x2="${f(b.x)}" y2="${f(b.y)}" stroke-dasharray="5 ${f(L + 40)}" style="--l:${f(L + 45)};animation-delay:${(i * .8).toFixed(1)}s"/>`;
  });
  nodes.forEach((n, i) => {
    const hot = i % 7 === 3, r = hot ? 3.6 : [2.6, 2.2, 1.8, 1.4][n.ri];
    if (hot) out += `<circle cx="${f(n.x)}" cy="${f(n.y)}" r="9" fill="none" stroke="#ff6a4d" stroke-opacity=".35"/>`;
    out += `<circle cx="${f(n.x)}" cy="${f(n.y)}" r="${r}" fill="${hot ? "#ff6a4d" : "#fff"}" opacity="${hot ? 1 : (.65 - n.ri * .12).toFixed(2)}"${hot ? ` class="hot" style="animation-delay:${(i % 3) * .9}s"` : ""}/>`;
  });
  /* three hubs: the research themes, wired to the photo and to the network */
  const hubIcons = icons;
  const narrow = W < 520, hr = narrow ? 13 : 17;
  [[-38, 0], [185, 1], [38, 2]].forEach(([deg, ti], k) => {
    const t = S.heroHubs[ti]; if (!t) return;
    const a = deg * Math.PI / 180, lw = t.title.length * (narrow ? 6.6 : 7.6) + 22, lh = narrow ? 22 : 26;
    let hx = cx + Math.cos(a) * R * 1.62, hy = cy + Math.sin(a) * R * 1.62;
    hx = Math.min(Math.max(hx, lw / 2 + 8), W - lw / 2 - 8); hy = Math.min(Math.max(hy, hr + 8), H - hr - lh - 14);
    if (narrow) {
      const pw = t.title.length * 6.6 + 44, py = cy + (k - 1) * 46, px = Math.min(W - pw - 12, cx + R + 34);
      const ex2 = cx + Math.cos(Math.atan2(py - cy, px - cx)) * (R + 6), ey2 = cy + Math.sin(Math.atan2(py - cy, px - cx)) * (R + 6);
      out += `<line x1="${f(ex2)}" y1="${f(ey2)}" x2="${f(px + 14)}" y2="${f(py)}" stroke-opacity=".5" stroke-width="1.2"/>`;
      out += `<rect x="${f(px)}" y="${f(py - 15)}" width="${f(pw)}" height="30" rx="15" fill="#0b1966" stroke="#fff" stroke-opacity=".45"/>`;
      out += `<svg x="${f(px + 3)}" y="${f(py - 12)}" width="24" height="24" viewBox="2 2 52 52">${hubIcons[t.icon] || icons.spark}</svg>`;
      out += `<text x="${f(px + 33)}" y="${f(py + 4)}" fill="#fff" stroke="none" font-family="Inter,sans-serif" font-size="12" font-weight="500">${esc(t.title)}</text>`;
      return;
    }
    const ex = cx + Math.cos(Math.atan2(hy - cy, hx - cx)) * (R + 8), ey = cy + Math.sin(Math.atan2(hy - cy, hx - cx)) * (R + 8);
    out = out.replace("<!--hubs-->", "") ;
    let h = `<line x1="${f(ex)}" y1="${f(ey)}" x2="${f(hx)}" y2="${f(hy)}" stroke-opacity=".55" stroke-width="1.4"/>`;
    nodes.map(m => [m, Math.hypot(m.x - hx, m.y - hy)]).sort((p, q) => p[1] - q[1]).slice(0, 3).forEach(([m]) => h += `<line x1="${f(hx)}" y1="${f(hy)}" x2="${f(m.x)}" y2="${f(m.y)}" stroke-opacity=".35"/>`);
    h += `<line class="sig" x1="${f(ex)}" y1="${f(ey)}" x2="${f(hx)}" y2="${f(hy)}" stroke-dasharray="6 ${f(Math.hypot(hx-ex, hy-ey) + 40)}" style="--l:${f(Math.hypot(hx-ex, hy-ey) + 46)};animation-delay:${ti * 1.2}s"/>`;
    h += `<circle cx="${f(hx)}" cy="${f(hy)}" r="${hr + 5}" fill="#0b1966" stroke="#fff" stroke-opacity=".25"/><circle cx="${f(hx)}" cy="${f(hy)}" r="${hr + 1}" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.3"/>`;
    h += `<svg x="${f(hx - hr)}" y="${f(hy - hr)}" width="${hr * 2}" height="${hr * 2}" viewBox="2 2 52 52">${hubIcons[t.icon] || icons.spark}</svg>`;
    const ly = hy + hr + 9;
    h += `<rect x="${f(hx - lw / 2)}" y="${f(ly)}" width="${f(lw)}" height="${lh}" rx="${lh / 2}" fill="#0b1966" fill-opacity=".85" stroke="#fff" stroke-opacity=".4"/>`;
    h += `<text x="${f(hx)}" y="${f(ly + lh / 2 + (narrow ? 4 : 4.5))}" text-anchor="middle" fill="#fff" stroke="none" font-family="Inter,sans-serif" font-size="${narrow ? 11.5 : 13}" font-weight="500">${esc(t.title)}</text>`;
    out += h;
  });
  net.innerHTML = out;
};
const netObs = new ResizeObserver(drawNet);
netObs.observe(net);
ph.addEventListener("load", drawNet);
}
